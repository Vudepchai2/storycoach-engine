[project]
name = "storycoach"
version = "0.1.0"
description = "Local storytelling coach engine: transcripts, voice measurements and per-person memory."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2,<2",
    "praat-parselmouth>=0.4.7,<0.5",
    "numpy>=2.5,<3",
    "av>=19.0,<20",
    "sounddevice>=0.5,<0.6",
]

[project.scripts]
storycoach = "storycoach.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storycoach"]

[tool.pytest.ini_options]
markers = ["slow: needs the Whisper model or Windows speech synthesis"]
testpaths = ["tests"]
